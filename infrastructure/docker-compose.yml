version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: school_bus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-school_bus_tracking}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-school_bus_tracking}']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Routing engine (road-following route geometry) ──────────────────────
  # Self-hosted OSRM (BSD-2, free, no key) over a prebuilt graph. This
  # service is PROFILE-GATED: plain `docker compose up -d` starts Postgres
  # alone, exactly as before. Start the engine only after a graph exists
  # (scripts/osrm-graph.sh writes it into ./osrm-data):
  #
  #   docker compose --profile routing up -d osrm
  #
  # Then point the app at it: ROUTING_SERVICE_URL=http://localhost:5000
  # (blank/unset keeps road geometry disabled — the maps draw the honest
  # dashed stop-to-stop line). See infrastructure/README.md → "OSRM routing
  # engine" and docs/live-tracking-map.md → "Road routing".
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0-debian
    profiles: ['routing']
    container_name: school_bus_osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld --threads 2 /data/${OSRM_REGION:-region}.osrm
    ports:
      - '${OSRM_PORT:-5000}:5000'
    volumes:
      # The prebuilt graph (git-ignored, produced by scripts/osrm-graph.sh),
      # mounted read-only: the engine never writes to it.
      - ./osrm-data:/data:ro
    healthcheck:
      # Stock osrm-routed has no dedicated /health route (it answers 400
      # InvalidUrl on /health) and the runtime image ships no curl/wget, so
      # the check speaks raw HTTP over bash's /dev/tcp and requires ANY HTTP
      # status line back: the engine is healthy iff it answers HTTP at all.
      # osrm-routed binds its port only after the graph is fully loaded, so
      # a successful connect is also a readiness signal.
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/5000 && printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -n1 <&3 | grep -q "^HTTP/1"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # A city-sized MLD graph loads in well under 1 GB; raise this for a
    # bigger extract (a full Geofabrik zone needs ~2 GB).
    mem_limit: 2g

volumes:
  postgres_data:
    driver: local
