# Production deployment for the SUPPORTED SINGLE INSTANCE:
#
#   app    - one Node.js process serving the Next.js web UI, the /api/v1 API
#            and Socket.IO (web/server.js)
#   db     - one PostgreSQL 16 + PostGIS 3.4 container with a data volume
#
# Horizontal scaling, Redis, object storage and paid managed services are
# intentionally out of scope (see docs/deployment.md, "Single-instance
# architecture").
#
# From the infrastructure/ directory:
#
#   cp .env.production.example .env.production   # then edit every CHANGE_ME
#   docker compose --env-file .env.production -f docker-compose.prod.yml build
#   docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migrate
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
#
# The committed .env.production.example contains placeholders only. The real
# .env.production is git-ignored and must never be committed or printed.

# Connection settings shared by the one-shot migration container and the app.
# Database credentials, JWT secret and CORS origin arrive through env_file
# (.env.production); only non-secret topology is pinned here.
x-app-environment: &app-environment
  NODE_ENV: production
  DB_HOST: db
  DB_PORT: '5432'
  # TLS is required by the production startup guard. The database presents a
  # self-signed certificate on the internal Docker network (generated by
  # db-tls-init); the server requires TLS without pinning that CA.
  DB_SSL: 'true'
  PORT: '3001'

services:
  # Generates a self-signed server certificate into a volume before PostgreSQL
  # starts, so the production DB_SSL=true guard is satisfied without shipping
  # any key material in the repository. Runs once per certificate lifetime
  # (10 years); subsequent starts find the volume populated and exit.
  db-tls-init:
    image: alpine:3.20
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        command -v openssl >/dev/null 2>&1 || apk add --no-cache openssl
        install -d -o 999 -g 999 -m 700 /certs
        if [ ! -s /certs/server.key ] || [ ! -s /certs/server.crt ]; then
          openssl req -new -x509 -days 3650 -nodes -newkey rsa:2048 \
            -keyout /certs/server.key -out /certs/server.crt \
            -subj '/CN=db'
          chown 999:999 /certs/server.key /certs/server.crt
          chmod 600 /certs/server.key
          chmod 644 /certs/server.crt
        fi
    volumes:
      - db_certs:/certs

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    depends_on:
      db-tls-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env.production}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/certs/server.key
    volumes:
      - db_certs:/var/lib/postgresql/certs:ro
      - db_data:/var/lib/postgresql/data
      # Same extension bootstrap as the development compose service.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  # Runs every pending migration against a healthy database and exits. The app
  # starts only after this completes successfully.
  migrate:
    image: school-bus-tracking:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    restart: 'no'
    env_file:
      - path: .env.production
        required: true
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: ['npm', 'run', 'db:migrate']
    networks:
      - internal

  app:
    image: school-bus-tracking:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: true
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Bind to loopback only: browser-facing TLS must be terminated by a
      # reverse proxy on the host (the refresh cookie is Secure/SameSite=None,
      # so sessions cannot work over plain HTTP).
      - '127.0.0.1:${APP_PORT:-3001}:3001'
    volumes:
      # Local-disk document uploads, kept across container replacements.
      - app_documents:/app/web/.document-storage
    networks:
      - internal

volumes:
  db_data:
  db_certs:
  app_documents:

networks:
  internal:
