<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">KidBus logo</title>
  <desc id="desc">A yellow GPS location pin combined with a navy school bus and the KIDBUS wordmark.</desc>
  <defs>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8C43A"/><stop offset="1" stop-color="#EAAE1D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#FCFCF9"/>
  <!-- unified location-pin mark -->
  <path fill="url(#yellow)" d="M400 82c-112 0-202 87-202 194 0 121 114 245 202 328 88-83 202-207 202-328 0-107-90-194-202-194Z"/>
  <!-- bus body -->
  <path fill="#F7C238" d="M184 303h357c24 0 43 19 43 43v104c0 19-15 34-34 34H205c-24 0-43-19-43-43V346c0-24 10-43 22-43Z"/>
  <path fill="#122D56" d="M184 303h357c24 0 43 19 43 43v35H184v-78Z"/>
  <rect x="184" y="359" width="400" height="111" rx="18" fill="#F7C238"/>
  <!-- windows -->
  <rect x="213" y="326" width="70" height="50" rx="12" fill="#122D56"/>
  <rect x="301" y="326" width="27" height="78" rx="13" fill="#122D56"/>
  <path fill="#122D56" d="M351 326h89c18 0 31 10 35 26l8 24H351v-50Z"/>
  <path fill="#F7C238" d="M419 326h21c18 0 31 10 35 26l8 24h-51l-13-50Z"/>
  <path fill="#122D56" d="M184 397h78c8 0 14 6 14 14s-6 14-14 14h-78v-28Z"/>
  <!-- front and grille -->
  <path fill="#122D56" d="M548 381h36v89h-36c-8 0-14-6-14-14v-61c0-8 6-14 14-14Z"/>
  <rect x="532" y="397" width="39" height="8" rx="4" fill="#F7C238"/>
  <rect x="532" y="414" width="39" height="8" rx="4" fill="#F7C238"/>
  <rect x="532" y="431" width="39" height="8" rx="4" fill="#F7C238"/>
  <!-- lights and roof detail -->
  <rect x="459" y="302" width="38" height="11" rx="5.5" fill="#FCFCF9"/>
  <rect x="496" y="398" width="19" height="19" rx="8" fill="#FCFCF9"/>
  <path d="M475 310l12 61" stroke="#FCFCF9" stroke-width="8" stroke-linecap="round"/>
  <!-- wheels -->
  <circle cx="260" cy="470" r="40" fill="#FCFCF9"/>
  <circle cx="260" cy="470" r="24" fill="#122D56"/>
  <circle cx="260" cy="470" r="11" fill="#FCFCF9"/>
  <circle cx="454" cy="470" r="40" fill="#FCFCF9"/>
  <circle cx="454" cy="470" r="24" fill="#122D56"/>
  <circle cx="454" cy="470" r="11" fill="#FCFCF9"/>
  <!-- wordmark -->
  <text x="400" y="650" text-anchor="middle" fill="#122D56" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" letter-spacing="2">KIDBUS</text>
</svg>
