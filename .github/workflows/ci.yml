
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job uses the reusable setup composite action
# (.github/actions/setup-node-deps) which checks out the repo and installs the
# full workspace from the lockfile.  Permissions are intentionally minimal:
# the workflow only needs to read the repository contents.
# Every job checks out the repository with actions/checkout and THEN calls the
# reusable setup composite action (.github/actions/setup-node-deps), which
# pins Node from .nvmrc and installs the full workspace from the lockfile.
# The composite action cannot check out for you (GitHub loads its definition
# from the runner workspace, which is empty until a job checks out), so the
# Checkout step is required at the top of every job below.
# Permissions are intentionally minimal: the workflow only needs to read the
# repository contents.
permissions:
  contents: read
jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4
      - name: Setup
        uses: ./.github/actions/setup-node-deps
      - name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4
      - name: Setup
        uses: ./.github/actions/setup-node-deps
      - name: Typecheck all workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4
      - name: Setup
        uses: ./.github/actions/setup-node-deps
      - name: Typecheck server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4
      - name: Setup
        uses: ./.github/actions/setup-node-deps
      - name: Run server unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4
      - name: Setup
        uses: ./.github/actions/setup-node-deps
      - name: Run web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4
      - name: Setup
        uses: ./.github/actions/setup-node-deps
      - name: Run mobile unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4
      - name: Setup
        uses: ./.github/actions/setup-node-deps
      - name: Run mobile simulations
      TEST_DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4
      - name: Setup
        uses: ./.github/actions/setup-node-deps

    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4
      - name: Setup
        uses: ./.github/actions/setup-node-deps
      - name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4
      - name: Setup
        uses: ./.github/actions/setup-node-deps
      - name: Export
