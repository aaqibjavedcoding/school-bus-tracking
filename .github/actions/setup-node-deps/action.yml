name: Setup Node.js and workspace dependencies

description: >-
  Install the npm workspace tree from package-lock.json and build the shared
  packages (via the lockfile-driven `npm ci` postinstall). Node is pinned from
  .nvmrc (the project's supported production version) and the npm download
  cache is enabled. Workflows MUST check out the repository with
  actions/checkout before calling this action — the runner loads this
  composite action's definition from the repo, so it cannot check out for you.

runs:
  using: composite
  steps:
    - name: Setup Node.js (pinned via .nvmrc)
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies from the lockfile
      shell: bash
      run: npm ci
